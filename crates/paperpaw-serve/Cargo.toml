[package]
name = "paperpaw-serve"
description = "Serves HTTP for PaperPaw plugins in shells with the standard library (emulator, Android)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
paperpaw-core.workspace = true
paperpaw-http.workspace = true
paperpaw-digest.workspace = true

# TLS for plugins' sockets (rustls with ring, owner decision 52; the
# authorities are Mozilla's, as on the X4). Not in the browser's module:
# it has no sockets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
# A certificate authority and servers of its own, for the handshake tests.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[lints]
workspace = true
