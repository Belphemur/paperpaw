[messages]
readwise-reader.plugin.name = Readwise Reader
readwise-reader.plugin.description = In Readwise Reader gespeicherte Artikel, als Bücher geholt.
readwise-reader.title = Readwise Reader
readwise-reader.fetch = Artikel holen
readwise-reader.token = Zugangstoken
readwise-reader.secret = Zugangstoken von Readwise Reader
readwise-reader.from = Artikel holen aus
readwise-reader.from.later = Später
readwise-reader.from.inbox = Posteingang
readwise-reader.from.help = Woher in Readwise Reader die Artikel genommen werden: die, die du für Später gespeichert hast, oder die in deinem Posteingang.
readwise-reader.help = Gib deinen Zugangstoken ein (readwise.io/access_token). Die Artikel kommen als Bücher ohne Bilder in den Ordner „Reader“; was du zu Ende gelesen hast, wird beim nächsten Holen archiviert.
readwise-reader.fetching = Artikel von Readwise Reader werden geholt …
# {fetched}, {archived} and {failed} are numbers of articles.
readwise-reader.done = Reader: {fetched} neu, {archived} archiviert.
readwise-reader.done-failed = Reader: {fetched} neu, {archived} archiviert, {failed} fehlgeschlagen.
readwise-reader.setup-needed = Readwise Reader braucht zuerst deinen Zugangstoken.
readwise-reader.bad-token = Readwise hat den Zugangstoken nicht angenommen. Prüfe ihn unter readwise.io/access_token.
readwise-reader.wait = Readwise bittet, kurz zu warten. Hole die Artikel in einer Minute noch einmal.
readwise-reader.no-network = Readwise Reader braucht ein Netzwerk.
readwise-reader.unreachable = Readwise ist nicht erreichbar. Prüfe die WLAN-Verbindung und versuche es erneut.
readwise-reader.unreadable = Readwise Reader kann seine Liste der geholten Artikel auf diesem Gerät nicht lesen; es wurde nichts geändert.
readwise-reader.secret.account = Readwise-Reader-Konto
readwise-reader.too-big = Readwise hat mehr gesendet, als dieses Gerät aufnimmt; das Holen wurde beendet.
