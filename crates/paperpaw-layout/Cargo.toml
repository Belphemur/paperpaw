[package]
name = "paperpaw-layout"
description = "Page layout for PaperPaw: lays out documents into pages (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "text-processing"]
keywords = ["e-reader", "layout", "pagination"]

[dependencies]
paperpaw-document.workspace = true
paperpaw-platform.workspace = true
paperpaw-text.workspace = true

[dev-dependencies]
proptest.workspace = true
# Its tests set drop capitals.
paperpaw-layout = { path = ".", features = ["drop-caps"] }

[features]
# Drop capitals (`Block::drop_cap`), set only where fonts can be drawn
# large: the SDK's `outline` turns this on. Without it a block asking for
# one is laid out as without, as bitmap fonts alone would anyway.
drop-caps = []

[lints]
workspace = true
