readwise-reader.wait = Readwise asks to wait a little. Fetch again in a minute.
readwise-reader.no-network = Readwise Reader needs a network.
readwise-reader.unreachable = Readwise cannot be reached. Check the Wi-Fi connection and try again.
readwise-reader.unreadable = Readwise Reader cannot read its list of fetched articles on this device, so nothing was changed.
